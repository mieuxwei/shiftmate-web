services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: shiftmate_test
      POSTGRES_PASSWORD: ${M2_DB_PASS:-shiftmate_local_only}
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shiftmate_test"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "127.0.0.1:5432:5432"
    profiles:
      - integration
    tmpfs:
      - /var/lib/postgresql/data

  api:
    build:
      context: .
      target: runtime
    environment:
      APP_ENV: development
      APP_TIMEZONE: Asia/Taipei
    ports:
      - "8000:8080"

  frontend:
    image: node:24-alpine
    working_dir: /app/frontend
    command: >-
      sh -c "corepack enable &&
      pnpm install --store-dir /pnpm/store --frozen-lockfile &&
      pnpm dev"
    environment:
      VITE_API_PROXY_TARGET: http://api:8080
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules
      - frontend_pnpm_store:/pnpm/store
    depends_on:
      - api
    profiles:
      - dev

volumes:
  frontend_node_modules:
  frontend_pnpm_store:
