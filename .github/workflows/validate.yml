name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy
      - run: pytest --cov=backend.app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t shiftmate-web:test .
      - run: docker run --detach --name shiftmate-web -p 8080:8080 shiftmate-web:test
      - name: Smoke test container
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://localhost:8080/api/v1/health; then
              curl --fail --silent http://localhost:8080/ | grep "ShiftMate Web"
              exit 0
            fi
            sleep 1
          done
          docker logs shiftmate-web
          exit 1
      - if: always()
        run: docker rm --force shiftmate-web || true
